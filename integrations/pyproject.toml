[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-integrations"
version = "0.1.0"
description = "Optional framework adapters for CONTINUITY durable workflows"
requires-python = ">=3.10"
authors = [{name = "Aryan Dev Singh Mankotia"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["continuity-runtime>=0.8.0,<1.0"]

[project.optional-dependencies]
langgraph = ["langgraph>=1.2.23,<2.0"]
openai-agents = ["openai-agents>=0.25.0,<1.0"]
fastapi = ["fastapi>=0.158.0,<1.0"]
all = ["langgraph>=1.2.23,<2.0", "openai-agents>=0.25.0,<1.0", "fastapi>=0.158.0,<1.0"]
test = ["pytest>=7.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
