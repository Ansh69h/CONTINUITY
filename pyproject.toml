[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-runtime"
version = "0.8.0"
description = "Python durable workflow recovery runtime for AI agents, automation, and distributed jobs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Aryan Dev Singh Mankotia"}]
keywords = [
    "python",
    "durable-workflows",
    "durable-execution",
    "workflow-recovery",
    "workflow-engine",
    "crash-recovery",
    "ai-agents",
    "llm-agents",
    "idempotency",
    "fault-tolerance",
    "event-sourcing",
    "causal-logging",
    "saga-pattern",
    "distributed-systems",
    "sqlite-wal",
    "postgresql",
    "redis",
    "opentelemetry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ansh69h/CONTINUITY"
Repository = "https://github.com/Ansh69h/CONTINUITY"
Documentation = "https://github.com/Ansh69h/CONTINUITY#readme"
Changelog = "https://github.com/Ansh69h/CONTINUITY/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ansh69h/CONTINUITY/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["continuity*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
continuity = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --ignore=tests/test_runner_unittest.py"
